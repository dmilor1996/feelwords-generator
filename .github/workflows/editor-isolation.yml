name: Studio regression tests

on:
  push:
    branches: [main, feat/studio-redesign]
  pull_request:
    paths:
      - index.html
      - 'assets/**'
      - 'tests/**'
      - package.json
      - package-lock.json
      - .github/workflows/editor-isolation.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
